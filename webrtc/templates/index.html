<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Duo · Video Call</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <main class="stage">
        <video id="remoteVideo" autoplay playsinline></video>

        <div class="self-frame">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <header class="topbar">
            <div class="brand">
                <span class="dot"></span>
                <span>Duo</span>
            </div>
            <div id="status" class="status">connecting…</div>
        </header>

        <div id="splash" class="splash">
            <div class="splash-card">
                <div class="pulse"><span></span><span></span><span></span></div>
                <h1 id="splashTitle">Tap to start</h1>
                <p id="splashSub">Allow camera & microphone access</p>
                <button id="startBtn" class="primary">Start call</button>
            </div>
        </div>

        <footer class="controls" hidden>
            <button id="micBtn" class="ctrl" aria-label="Mute">
                <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z"/></svg>
            </button>
            <button id="endBtn" class="ctrl end" aria-label="End">
                <svg viewBox="0 0 24 24"><path d="M12 9c-3.5 0-6.8 1.1-9.5 3.2L1 14.7c-.4.6-.3 1.4.2 1.8l2.5 1.9c.4.3 1 .3 1.4 0L7.6 16c.3-.3.5-.7.5-1.1v-2.3c2.5-.9 5.3-.9 7.8 0v2.3c0 .4.2.8.5 1.1l2.5 2.4c.4.3 1 .3 1.4 0l2.5-1.9c.5-.4.6-1.2.2-1.8l-1.5-2.5C18.8 10.1 15.5 9 12 9Z"/></svg>
            </button>
            <button id="camBtn" class="ctrl" aria-label="Camera off">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
            </button>
        </footer>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
